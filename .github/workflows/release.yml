name: Release APK

# Builds, tests and signs the APK for a published release, then attaches it.
# Hardening notes:
# - Actions are pinned to commit SHAs (Dependabot keeps them current).
# - Untrusted values (the tag name) reach scripts only through env vars, never ${{ }}
#   inside run: blocks.
# - The build job can only read the repo; only the small upload job can write, and it
#   never sees the signing secrets.
# - The signing job runs in the "release" environment: put the RELEASE_* secrets there
#   and add required reviewers / a tag rule in Settings > Environments.
on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      # No cache: a release build must not restore anything a PR build could have written.
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-disabled: true

      # Android requires versionCode to strictly increase for an install to be treated
      # as an upgrade rather than a conflicting/rejected install, so it can't stay
      # hardcoded. Requires a plain vMAJOR.MINOR.PATCH release tag — fails loudly rather
      # than silently falling back to a stale versionCode for anything else (e.g. a
      # -rc1/-test suffix).
      - name: Derive app version from the release tag
        run: |
          if [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"
            echo "APP_VERSION_CODE=$((major * 1000000 + minor * 1000 + patch))" >> "$GITHUB_ENV"
            echo "APP_VERSION_NAME=${major}.${minor}.${patch}" >> "$GITHUB_ENV"
          else
            echo "::error::Release tag is not a plain vMAJOR.MINOR.PATCH — refusing to guess a versionCode." >&2
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PreleaseVersionCode="$APP_VERSION_CODE" -PreleaseVersionName="$APP_VERSION_NAME"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "LoRaFieldOpsConfig-$TAG.apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-apk
          path: LoRaFieldOpsConfig-*.apk
          if-no-files-found: error
          retention-days: 7

  upload:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-apk

      - name: Upload APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "LoRaFieldOpsConfig-$TAG.apk" --clobber --repo "$GITHUB_REPOSITORY"
